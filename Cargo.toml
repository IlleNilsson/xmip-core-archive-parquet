[package]
name = "xmip-core-archive-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-archive-parquet"
description = "Parquet archive target: one item is one Apache Parquet file under a directory, created whole and never written over, its receipt the file archive's file URI and SHA-256. A xmip-core-archive technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The ArchiveStore trait and its types live there,
# and so do the file created whole, the `file://` receipt of a directory
# and the checksum a restore checks (ADR-0044).
archive = { workspace = true }
arrow = "60"
parquet = { version = "60", features = ["arrow"] }

[dev-dependencies]
# The tests archive the capability's fixture item (ADR-0044); the feature
# is enabled here so it is never part of a production build.
archive = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
